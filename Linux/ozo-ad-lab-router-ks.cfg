# Kickstart for AlmaLinux 10 on Hyper-V
# Hostname : router
# Version  : RHEL10
# Storage  : sda
# Network  : eth0
# eth0 MAC : AUTO
# eth0 IP  : DHCP
# eth0 GW  : DHCP
# eth0 SNM : DHCP
# eth0 NS1 : 1.1.1.1
# Network  : eth1
# eth1 MAC : AUTO
# eth1 IP  : 172.16.1.1
# eth1 SNM : 255.255.255.0

# Use text install
#text

# Kdump
%addon com_redhat_kdump --enable --reserve-mb='auto'
%end

# Keyboard layouts
keyboard --xlayouts='us'

# System language
lang en_US.UTF-8

# Install source
repo --name="AppStream" --baseurl=http://repo.almalinux.org/almalinux/10/AppStream/x86_64/os
url --url="http://repo.almalinux.org/almalinux/10/BaseOS/x86_64/os/"

# Package selection
%packages
@^minimal-environment
dnf-automatic
dracut-live
%end

# Skip the Setup Agent on first boot
firstboot --disable

# Do not configure the X Window System
skipx

# Disk configuration
ignoredisk --only-use=sda
zerombr
# Partition clearing information
clearpart --all --initlabel --drives=sda
# Disk partitioning information; total is 23040 MiB
part /boot --fstype="xfs" --ondisk=sda --size=953 --asprimary
part /boot/efi --fstype="efi" --ondisk=sda --size=477 --fsoptions="umask=0077,shortname=winnt"
part pv.01 --fstype="lvmpv" --ondisk=sda --size=1 --grow
volgroup almalinux --pesize 4096 pv.01
logvol /srv --fstype="xfs" --size=1024 --name=srv --vgname=almalinux
logvol /var/log/audit --fstype="xfs" --size=1024 --name=var_log_audit --vgname=almalinux
logvol swap --fstype="swap" --size=4096 --name=swap --vgname=almalinux
logvol /tmp --fstype="xfs" --size=2048 --name=tmp --vgname=almalinux
logvol /home --fstype="xfs" --size=2048 --name=home --vgname=almalinux
logvol /var/log --fstype="xfs" --size=1024 --name=var_log --vgname=almalinux
logvol /var --fstype="xfs" --size=4096 --name=var --vgname=almalinux
logvol / --fstype="xfs" --size=4096 --name=root --vgname=almalinux
logvol /var/tmp --fstype="xfs" --size=1024 --name=var_tmp --vgname=almalinux

# System bootloader configuration
bootloader --append="crashkernel=1G-4G:192M,4G-64G:256M,64G-:512M" --location=mbr --boot-drive=sda

# System timezone
timezone Etc/UTC --utc
timesource --ntp-pool pool.ntp.org

# Root password
rootpw --plaintext OZOADL@b$ecurePassw0rd

# License agreement
eula --agreed

# Network information
network --bootproto=dhcp --device=eth0 --nameserver=1.1.1.1 --noipv6 --activate
network --bootproto=static --device=eth1 --ip=172.16.1.1 --netmask=255.255.255.0 --noipv6 --activate
network --hostname=router

# System services
services --enabled="chronyd"
services --enabled="firewalld"
services --enabled="sshd"

# SELinux
selinux --enforcing

# Firewall
firewall --enabled --ssh

# Post-installation behavior
shutdown

###############################################################################
# post chroot
%post --interpreter=/usr/bin/bash --erroronfail --log=/root/ks-post-chroot.log

# Configure IP forwarding
echo "net.ipv4.ip_forward=1" >> /etc/sysctl.conf
# Configure firewall
firewall-offline-cmd --remove-service dhcpv6-client
firewall-offline-cmd --remove-service cockpit
firewall-offline-cmd --zone=public --set-target=ACCEPT
firewall-offline-cmd --zone=public --add-forward
firewall-offline-cmd --zone=public --add-rich-rule='rule family=ipv4 source address=172.16.1.0/24 masquerade'

# Apply updates
dnf -y update

# Enable DNF Automatic
systemctl enable dnf-automatic.timer

# Configure DNF Automatic
sed -i s/"apply_updates = no"/"apply_updates = yes"/ /etc/dnf/automatic.conf
sed -i s/"reboot = never"/"reboot = when-needed"/ /etc/dnf/automatic.conf

%end
