set default="0"
set timeout=60

function load_video {
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod all_video
}

load_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod ext2

search --no-floppy --label 'OZO-AD-Lab-Router' --set=root

menuentry 'Install OZO AD Lab Router' --class fedora --class gnu-linux --class gnu --class os {
	linuxefi /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=OZO-AD-Lab-Router ip=eth0:dhcp inst.text inst.ks=cdrom:/ks.cfg
	initrdefi /images/pxeboot/initrd.img
}
